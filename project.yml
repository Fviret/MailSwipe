name: MailSwipe
options:
  bundleIdPrefix: com.floviret
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr
targets:
  MailSwipe:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - fr
          - en
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID_SCHEME)
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.floviret.mailswipe
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GOOGLE_REVERSED_CLIENT_ID_SCHEME: mailswipe.oauth
  MailSwipeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MailSwipe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.floviret.mailswipe.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
  MailSwipeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MailSwipe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.floviret.mailswipe.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MailSwipe:
    build:
      targets:
        MailSwipe: all
    test:
      gatherCoverageData: true
      coverageTargets:
        - MailSwipe
      targets:
        - MailSwipeTests
        - MailSwipeUITests
